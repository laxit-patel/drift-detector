# Run the test suite on every PR and every push to master — the merge gate.
#
# The suite is hermetic: no network, no ast-grep binary (tests/astgrep_fake.py injects the
# engine), stdlib + PyYAML + jsonschema only. So it is fast and deterministic, and it runs the
# no-internal-identifiers guard (tests/test_no_internal_identifiers.py) — the invariant that
# keeps the public tree free of the internal host and client repo names — on every change.
name: ci

on:
  pull_request: {}
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065      # v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install -q pytest "PyYAML>=6.0" jsonschema

      - name: Run tests (incl. the no-internal-identifiers guard)
        run: python -m pytest -q
